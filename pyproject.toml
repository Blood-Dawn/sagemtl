[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemtl"
version = "0.0.1"
description = "SageMTL toolchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "httpx[http2]>=0.25",
    "lxml>=5.3",
    "selectolax>=0.3.21",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "textual>=0.44",
]

[tool.setuptools.packages.find]
include = ["sagemtl*"]
exclude = ["data*", "tests*"]

[project.optional-dependencies]
crawl = ["beautifulsoup4>=4.12", "lxml>=5.3", "selectolax>=0.3.21", "httpx[http2]>=0.25"]
docs  = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "pymdown-extensions"]
serve = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]
tui = ["textual>=0.44"]
dev = [
    "beautifulsoup4>=4.12",
    "black>=24.3.0",
    "httpx[http2]>=0.25",
    "lxml>=5.3",
    "pre-commit>=3.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "selectolax>=0.3.21",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "textual>=0.44",
]

[project.scripts]
sagemtl = "sagemtl.cli:main"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring network access (deselect with '-m \"not integration\"')",
]
addopts = "-v --tb=short -m 'not integration'"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pythonjsonlogger.*",
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
]
