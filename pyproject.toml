[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemtl"
version = "0.0.1"
description = "SageMTL toolchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "httpx[http2]>=0.25",
    "lxml>=5.3",
    "selectolax>=0.3.21",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "textual>=0.44",
]

[tool.setuptools.packages.find]
include = ["sagemtl*"]
exclude = ["data*", "tests*"]

[project.optional-dependencies]
crawl = ["beautifulsoup4>=4.12", "lxml>=5.3", "selectolax>=0.3.21", "httpx[http2]>=0.25"]
lncrawl = ["lightnovel-crawler>=3.0.0"]
docs  = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "pymdown-extensions"]
serve = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]
tui = ["textual>=0.44"]
dev = [
    "beautifulsoup4>=4.12",
    "black>=24.3.0",
    "httpx[http2]>=0.25",
    "lxml>=5.3",
    "pre-commit>=3.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "selectolax>=0.3.21",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "textual>=0.44",
]

[project.scripts]
sagemtl = "sagemtl.cli:main"
